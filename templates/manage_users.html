{% extends "base.html" %}{% block title %}Manage users{% endblock %}
{% block content %}<div class="page-heading"><div><div class="eyebrow">IDENTITY ADMINISTRATION</div><h2>Manage users</h2><p class="muted">Update user attributes that feed into ABAC decisions.</p></div></div>
<div class="table-wrap"><table class="table align-middle"><thead><tr><th>User</th><th>Role</th><th>Department</th><th>Clearance</th><th>Active</th><th>Update</th></tr></thead><tbody>{% for u in users %}<tr><form method="post" action="{{ url_for('update_user', user_id=u.id) }}"><td><b>{{ u.name }}</b><div class="small muted">{{ u.email }}</div></td><td><select name="role" class="form-select form-select-sm"><option value="student" {{ 'selected' if u.role=='student' }}>Student</option><option value="faculty" {{ 'selected' if u.role=='faculty' }}>Faculty</option><option value="librarian" {{ 'selected' if u.role=='librarian' }}>Librarian</option><option value="admin" {{ 'selected' if u.role=='admin' }}>Admin</option></select></td><td><input class="form-control form-control-sm" name="department" value="{{ u.department }}"></td><td><select class="form-select form-select-sm" name="clearance"><option value="1" {{ 'selected' if u.clearance==1 }}>1</option><option value="2" {{ 'selected' if u.clearance==2 }}>2</option><option value="3" {{ 'selected' if u.clearance==3 }}>3</option></select></td><td><input type="checkbox" name="active" {{ 'checked' if u.active }}></td><td><button class="btn btn-sm btn-primary">Save</button></td></form></tr>{% endfor %}</tbody></table></div>{% endblock %}
