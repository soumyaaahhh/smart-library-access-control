{% extends "base.html" %}{% block title %}Create account{% endblock %}
{% block content %}<div class="auth-wrap"><div class="auth-card"><div class="eyebrow">JOIN THE LIBRARY</div><h2>Create student account</h2><p class="muted">New registrations receive student-level access by default.</p>
<form method="post"><label>Full name</label><input class="form-control mb-3" name="name" required><label>University email</label><input class="form-control mb-3" type="email" name="email" required><label>Department</label><select class="form-select mb-3" name="department"><option>Computer Science</option><option>Information Technology</option><option>Electronics</option><option>Mechanical</option><option>General</option></select><label>Password (minimum 8 characters)</label><input class="form-control mb-4" type="password" name="password" minlength="8" required><button class="btn btn-primary w-100 btn-lg">Create account</button></form></div></div>{% endblock %}
